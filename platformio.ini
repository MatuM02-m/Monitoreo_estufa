[platformio]
; Fuera de OneDrive, para no sincronizar miles de archivos de compilación
workspace_dir = ${sysenv.USERPROFILE}/.platformio/workspaces/monitoreo_estufa

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; Partición por defecto: ~1,4 MB para LittleFS (18 h ocupan ~200 kB)
board_build.filesystem = littlefs
lib_deps =
	knolleary/PubSubClient @ ^2.8
	paulstoffregen/OneWire @ ^2.3.8
	milesburton/DallasTemperature @ ^3.11.0
